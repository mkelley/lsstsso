[project]
name = "lsstsso"
description = "Inspect data of solar system objects observed by LSST"
readme = "README.md"
authors = [{ name = "Michael S. P. Kelley", email = "msk@astro.umd.edu" }]
license = { text = "BSD 3-Clause License" }
dependencies = [
    "astropy>=8",
    "matplotlib>=3.11",
    "numpy>=2.3",
    "pyvo>=1.8",
    "sbpy>=0.6",
    "scipy>=1.17",
]
dynamic = ["version"]

# [project.urls]
# homepage = "https://link-to-your-project"

[build-system]
requires = ["setuptools>=80", "wheel", "setuptools_scm[toml]>=9"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "lsstsso/_version.py"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
