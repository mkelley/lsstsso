[project]
name = "lsstsso"
description = "Analyze data of solar system objects observed by Rubin Observatory / LSST"
readme = "README.md"
authors = [{ name = "Michael S. P. Kelley", email = "msk@astro.umd.edu" }]
license = { text = "BSD 3-Clause License" }
requires-python = ">=3.12"
dependencies = [
    "astropy>=8",
    "matplotlib>=3.11",
    "numpy>=2.3",
    "pyvo>=1.8",
    "sbpy>=0.6",
    "scipy>=1.17",
]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/mkelley/lsstsso"

[project.optional-dependencies]
test = [
    "coverage",
    "pytest>=8.0",
    "pytest-doctestplus>=1.7.0",
    "pytest-remotedata",
    "tox>=4.33",
]

docs = [
    "packaging",
    "pydata-sphinx-theme",
    "pytest-doctestplus>=1.7.0",
    "pytest-remotedata",
    "sphinx-automodapi",
]

[build-system]
requires = ["setuptools>=80", "wheel", "setuptools_scm[toml]>=9"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "lsstsso/_version.py"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["lsstsso", "docs"]
norecursedirs = ["docs[\\/]_build"]
astropy_header = true
doctest_plus = "enabled"
text_file_format = "rst"
remote_data_strict = true
addopts = ["--doctest-rst", "--doctest-plus", "--color=yes"]
xfail_strict = true
doctest_norecursedirs = ["*/setup_package.py", "docs/_build"]
